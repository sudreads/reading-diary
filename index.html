<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' blob: data: https://covers.openlibrary.org https://archive.org https://*.archive.org https://*.googleusercontent.com; connect-src 'self' https://www.googleapis.com https://openidconnect.googleapis.com https://accounts.google.com https://openlibrary.org https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#c2410c">
  <meta name="description" content="A private reading diary: journal every book, keep a streak, build a trophy road.">
  <title>Reading Diary</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Reading Diary</span>
    <button id="pill" class="pill grey" type="button">Loading…</button>
  </header>
  <button id="update" class="update" type="button" hidden>A new version is ready - tap to reload</button>
  <main id="main"></main>
  <nav class="tabbar" aria-label="Sections"></nav>
  <div id="sheets"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
